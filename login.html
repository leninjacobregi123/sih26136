<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: 1.5rem; margin-top: 1rem; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 1rem; }
  .card h2 { font-size: 1.05rem; margin: 0 0 .4rem; }
  .roles { display: grid; gap: .4rem; margin-top: .6rem; }
  .roles button { text-align: left; }
</style>
</head>
<body>
<h1>Sign in</h1>
<div class="cols">
  <form class="card" id="login">
    <h2>Your account</h2>
    <p class="muted">Accounts are made by the programme desk. There is no sign-up.</p>
    <label>Email <input name="email" type="email" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" style="margin-top:1rem">Sign in</button>
    <p id="status" role="status"></p>
  </form>
  <div class="card">
    <h2>Try a demo role</h2>
    <p class="muted">No password. Demo accounts act only on the simulated demo passport, never on real pilots.</p>
    <div class="roles" id="roles"></div>
  </div>
</div>
<script src="assets/app.js"></script>
<script>
const next = new URLSearchParams(location.search).get("next");
// Only ever return to a page on this site.
const go = (fallback) => (location.href = next && /^[a-z0-9-]+\.html(\?[^\s]*)?$/.test(next) ? next : fallback);
const status = document.getElementById("status");

App.user().then(App.nav);
document.getElementById("roles").innerHTML = Object.entries(App.ROLE)
  .map(([id, label]) => `<button data-role="${id}">${App.esc(label)}</button>`).join("");
document.getElementById("roles").onclick = async (e) => {
  const role = e.target.closest("button")?.dataset.role;
  if (!role) return;
  try { await App.signInDemo(role); go("passport.html"); }
  catch (err) { status.textContent = "Not signed in: " + err.message; status.className = "err"; }
};
document.getElementById("login").onsubmit = async (e) => {
  e.preventDefault();
  status.textContent = "Signing in…"; status.className = "";
  try {
    const f = Object.fromEntries(new FormData(e.target));
    await App.api("/api/auth", { method: "POST", body: { action: "login", ...f } });
    go("pilots.html");
  } catch (err) { status.textContent = err.message; status.className = "err"; }
};
</script>
</body>
</html>
